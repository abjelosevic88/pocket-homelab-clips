name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-clips ./cmd/pocket-clips
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pc DEMO_DATA=true AUTH_MODE=none ./pocket-clips &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/dashboard | grep -q clips_today
          curl -fsS 'http://localhost:8080/api/v1/search?q=dock' | grep -q 'Docker logs'
          curl -fsS 'http://localhost:8080/api/v1/snippets/expand?keyword=thx&arg.name=CI' | grep -q 'Hi CI'
          curl -fsS -o /dev/null -w '%{redirect_url}' 'http://localhost:8080/go/g?q=hello' | grep -q 'google.com/search?q=hello'
          curl -fsS -X POST http://localhost:8080/api/v1/clips -H 'Content-Type: text/plain' --data 'https://example.com' | grep -q '"kind":"link"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-clips:pr
