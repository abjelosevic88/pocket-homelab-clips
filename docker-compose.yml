services:
  pocket-clips:
    image: ghcr.io/abjelosevic88/pocket-homelab-clips:latest
    container_name: pocket-clips
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-UTC}
      BASE_URL: ${BASE_URL:-}
      # Set both to skip the first-run setup screen and create the admin directly:
      # ADMIN_EMAIL: ${ADMIN_EMAIL}
      # ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # AUTH_MODE: proxy                # trust Remote-User from Authelia / Authentik / Tinyauth
      # LINK_TITLES: "false"            # never fetch <title> of copied links (air-gapped box)
      # DEMO_DATA: "true"               # seed sample clips, snippets and quicklinks into an empty database
    volumes:
      - ./data:/data
